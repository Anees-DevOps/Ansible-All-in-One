---
- name: Install and Manage Nginx
  hosts: webservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Update package repository
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Verify Nginx service status
      command: systemctl is-active nginx
      register: nginx_status

    - name: Display Nginx status
      debug:
        msg: "Nginx is {{ nginx_status.stdout }} on {{ ansible_facts.hostname }}"
